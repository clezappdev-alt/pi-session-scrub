project: session-scrub
type: pi-plugin
repo_root: /home/cleceta/AI_projects_V3/PI_Agent-MyPlugins/session-scrub
problem_input: PRD.md
working_contract: AGENTS.md

stack:
  language: typescript-strict
  runtime: pi-extension-via-jiti
  entry: extensions/session-scrub/index.ts
  pi_version: 1.2.0
  build_step: none
  core_libs: peerDependencies-star

testing:
  runner: 'node --test "extensions/session-scrub/*.test.ts"'
  typecheck_gate: ./scripts/typecheck.sh
  manual_trial: "pi -e ./extensions/session-scrub/index.ts + /reload"
  install_gate: tagged-versions-only
  conventions:
    - typescript-skill-const-types-flat-interfaces-no-any
    - english-code-commits-spanish-docs-ok

sdd:
  execution: interactive
  artifact_store: openspec
  changes_dir: openspec/changes
  # A change is `spec.md` (requirement delta) + `tasks.md` (the one task ledger).
  # proposal/design/verify/sync/archive are for changes big enough to earn them,
  # not the default; the archive is history and is never maintained.
  change_artifacts: spec.md + tasks.md
  delivery_strategy: ask-on-risk
  review_budget_lines: 400
  strict_tdd: true
  # Reality, recorded instead of a gate nobody runs: phases are summarized at
  # their boundaries and work continues, because continuity is the harness rule
  # and a per-phase approval gate would only be answered with "yes" every time.
  # The owner's decision points are delivery (push, PR, merge) and scope.
  phase_gates:
    - summarize-at-phase-boundaries
    - owner-decides-delivery-and-scope

skill_registry: .atl/skill-registry.md
skills:
  - /home/cleceta/.pi/agent/skills/pi-plugin-dev/SKILL.md
  - /home/cleceta/.pi/agent/skills/pi-sessions/SKILL.md
  - /home/cleceta/.pi/agent/skills/pi-packages/SKILL.md
  - /home/cleceta/.pi/agent/skills/typescript/SKILL.md

constraints:
  - zero-tokens-by-default-no-before_agent_start-injection
  - opt-in-commands-only
  - never-touch-live-session-trash-reversible-only
  - meta-and-code-never-share-a-commit
  - no-duplicated-pi-api-docs-lives-in-pi-plugin-dev
