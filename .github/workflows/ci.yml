# The check CONTRIBUTING.md documents, run on the compatibility floor and on the
# current LTS. A pull request from a fork arrives with a read-only token and no
# secrets, so nothing here may need either one.
#
# The required status checks in the branch ruleset are these job names verbatim:
# `check (node 22.19.0)` and `check (node 24.x)`. Changing the matrix means
# changing the ruleset in the same pull request, or the gate stops matching.
name: check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24.x']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The anchor tests compare a document against `git describe --tags`.
          # The default depth of 1 fetches no tags, so `describe` fails and both
          # tests skip — a green run would mean "not checked", not "correct".
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Print the runtime
        run: node --version
      - name: Install from the lockfile, without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check
        run: npm run check
