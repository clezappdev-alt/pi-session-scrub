# The PR ceremony gate — the three facts a machine can check without reading the diff.
#
# Why this file exists: CONTRIBUTING.md and the pull request template already declared this
# ceremony (`Closes #N`, one `type:*` label, a Conventional Commit title) and nothing enforced
# any of it, so every PR so far skipped it — including the maintainer's. A declared rule with
# no gate is worse than no rule: it looks strict and it trains people to pass it by.
#
# `ci.yml` stays the gate that proves the CODE. This one only proves the CEREMONY, which is why
# it runs on label and title edits too: the label arrives after the body.
#
# The checks live in `.github/scripts/pr-ceremony.cjs` and are pinned by its own tests, so the
# gate can be read, corrected in a pull request, and reproduced locally. The pull request it
# checks is read ONCE from the API, by `.github/scripts/fetch-pull-request.cjs`, and the gate
# decides on that one file — never on the event payload, which is a memory of an earlier
# moment, and never on two sources that could disagree:
#
#   node --test .github/scripts/pr-ceremony.test.cjs
#   PR_TITLE="fix(scrub): x" PR_BODY="Closes #1" PR_LABELS='[{"name":"type:bug"}]' \
#     node .github/scripts/pr-ceremony.cjs
name: pr-ceremony

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

# One run per pull request at a time, derived from the PR number.
#
# Measured 2026-10-29: opening a PR whose label is already applied fires `opened` AND
# `labeled`, so three consecutive PRs (#48, #50, #52) each got two identical ceremony
# runs at the same second — the same verdict twice, double the minutes, and a checks
# list that is harder to read than the rule it enforces.
concurrency:
  group: pr-ceremony-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The accepted window that concurrency opens, written down so nobody "fixes" it twice.
#
# Cancelling the older run leaves a `ceremony` check displayed as cancelled on this head SHA
# for the seconds the replacement needs to finish. A required check resolves per head SHA
# against the latest run of it, so the cancelled one cannot hold the merge, and the run that
# replaces it is already in flight: the window closes itself. Measured 2026-10-29, when two
# events (`opened` and `labeled`) arrived for the same PR. Deliberately not coded around —
# bounding `cancel-in-progress` to a SHA would add a key to buy what the head-SHA rule
# already guarantees.

jobs:
  ceremony:
    runs-on: ubuntu-latest
    # The handoff file is named once, here, and both steps below use this name: the read
    # writes it, the gate reads it. Two spellings of one path are two things to keep in step
    # for no gain.
    env:
      PR_JSON_PATH: ${{ runner.temp }}/pull-request.json
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.19.0'

      # The gate's own tests run before the gate: a check that silently passed everything
      # would be indistinguishable from a green PR.
      - name: The gate's own tests
        run: node --test .github/scripts/pr-ceremony.test.cjs

      # The pull request is read once, and the gate decides on what came back.
      #
      # The old shape had two defects. The title and the body came from the event payload
      # while the labels came from the API — two moments of the same pull request in one
      # verdict, and a body edited at the wrong second described as it was a minute earlier.
      # And the one network call on the required path had no retry: a transient 5xx or a
      # rate limit failed this job until somebody re-ran it by hand.
      #
      # One read now returns the whole pull request — title, body and labels in the same
      # response — and it retries three times, one and two seconds apart. A read that still
      # fails FAILS this job with the gate's own message. It never falls through to a green
      # check: a gate that passes when it could not read its input enforces nothing, and the
      # `ceremony` check is required, so a false green here is a merge nobody checked.
      - name: Read this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          node .github/scripts/fetch-pull-request.cjs
          "$GITHUB_REPOSITORY" "$PR_NUMBER" "$PR_JSON_PATH"

      - name: Check this pull request
        run: node .github/scripts/pr-ceremony.cjs
